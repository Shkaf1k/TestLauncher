<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Превью Лаунчера</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0f12;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .launcher {
      width: 850px;
      height: 520px;
      background: #18181e;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 1px solid #2a2a35;
      overflow: hidden;
    }

    .header {
      background: #121217;
      padding: 15px 25px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #2a2a35;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .content {
      display: flex;
      flex: 1;
      padding: 20px;
      gap: 20px;
    }

    .news-section {
      flex: 2;
      background: #202028;
      padding: 20px;
      border-radius: 8px;
      overflow-y: auto;
    }

    .news-section h3 {
      margin-bottom: 15px;
      color: #e0e0e0;
    }

    .news-card {
      background: #2a2a36;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 12px;
      border-left: 4px solid #ff4757;
    }

    .news-card h4 {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .news-card p {
      font-size: 13px;
      color: #aaaaee;
    }

    .side-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #202028;
      padding: 20px;
      border-radius: 8px;
    }

    .status-box h4 {
      margin-bottom: 8px;
    }

    .status {
      font-size: 13px;
      color: #2ed573;
    }

    .btn-play {
      background: #ff4757;
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-play:hover {
      background: #ff6b81;
    }

    .btn-play:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="launcher">
    <div class="header">
      <span>Моя Игра — Launcher</span>
      <span style="font-size: 12px; color: #777;">v1.0.0</span>
    </div>
    
    <div class="content">
      <div class="news-section">
        <h3>Новости и обновления</h3>
        
        <div class="news-card">
          <h4>Патч 1.0.2 уже доступен!</h4>
          <p>Исправлены ошибки, добавлена новая локация и улучшена оптимизация.</p>
        </div>
        
        <div class="news-card">
          <h4>Ивент на выходных</h4>
          <p>Получайте двойной опыт за выполнение всех заданий в субботу и воскресенье.</p>
        </div>
      </div>

      <div class="side-panel">
        <div class="status-box">
          <h4>Статус клиента</h4>
          <p class="status">● Готов к запуску (v1.0.2)</p>
        </div>

        <button class="btn-play">Играть</button>
      </div>
    </div>
  </div>

</body>
</html>
